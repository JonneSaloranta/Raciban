<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raciban</title>
<script>
  // Tallennettu valinta (light/dark) tai järjestelmän asetus
  document.documentElement.dataset.theme = localStorage.getItem('simple-kanban-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --ink: #2b2a27;
    --muted: #8a857a;
    --line: #e2ddd1;
    --accent: #d9534f;
    --col: #ebe6da;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
    --shadow-hover: 0 2px 8px rgba(0,0,0,.12);
    --input: #fff;
    --hover: rgba(0,0,0,.05);
    --drop: #eef4ff;
    --cal-other: #f9f7f2;
    --cal-weekend: #fbf9f4;
    --banner-bg: #fff3cd; --banner-ink: #7a5a00; --banner-line: #f0dc9a;
    --soon-bg: #fdebc8; --soon-ink: #8a5a00;
    --over-bg: #f8d7d6; --over-ink: #a12622;
    --done-bg: #dff0d8; --done-ink: #3c763d;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18;
    --panel: #252421;
    --ink: #ebe7de;
    --muted: #9b968b;
    --line: #3a3833;
    --accent: #ef6f6a;
    --col: #2d2b27;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
    --shadow-hover: 0 2px 10px rgba(0,0,0,.55);
    --input: #1e1d1b;
    --hover: rgba(255,255,255,.06);
    --drop: #26324a;
    --cal-other: #201f1c;
    --cal-weekend: #23221f;
    --banner-bg: #3a3220; --banner-ink: #f0d58a; --banner-line: #5a4b26;
    --soon-bg: #4a3a1a; --soon-ink: #f5c46a;
    --over-bg: #4d2523; --over-ink: #ff8f8a;
    --done-bg: #24402a; --done-ink: #8fd49a;
    color-scheme: dark;
  }
  body, aside, header, .column, .card, dialog, .cal-day { transition: background-color .2s, color .2s; }
  .theme-toggle { float: right; font-size: 16px; padding: 0 4px; line-height: 1; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 10px;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  button.danger { color: var(--accent); }
  button.icon { border: none; background: none; padding: 2px 6px; color: var(--muted); }
  button.icon:hover { color: var(--ink); }
  input, textarea {
    font: inherit; width: 100%; padding: 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--input); color: var(--ink);
  }
  textarea { resize: vertical; min-height: 100px; }

  /* Sivupalkki */
  aside {
    width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px;
  }
  aside h1 { font-size: 18px; margin: 0 0 16px; letter-spacing: .5px; }
  aside h2 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; letter-spacing: 1px; }
  #projectList { list-style: none; padding: 0; margin: 0 0 12px; overflow-y: auto; flex: 1; }
  #projectList li {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center; margin-bottom: 2px;
  }
  #projectList li:hover { background: var(--bg); }
  #projectList li.active { background: var(--ink); color: var(--panel); }
  #projectList li .count { font-size: 12px; opacity: .6; }
  #archiveSection { margin: 12px 0 4px; border-top: 1px solid var(--line); padding-top: 12px; }
  #archiveSection summary { font-size: 11px; text-transform: uppercase; color: var(--muted);
    letter-spacing: 1px; cursor: pointer; font-weight: 700; user-select: none; }
  #archiveList { list-style: none; padding: 0; margin: 8px 0 0; max-height: 30vh; overflow-y: auto; }
  #archiveList li { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 6px; }
  #archiveList li:hover { background: var(--bg); color: var(--ink); }
  #archiveList li.active { background: var(--ink); color: var(--panel); }
  #archiveList li .date { font-size: 11px; opacity: .7; white-space: nowrap; }
  .archive-folder { font-size: 12px; color: var(--muted); margin: 8px 0 4px; display: flex;
    align-items: center; gap: 4px; flex-wrap: wrap; }
  .archive-folder button { font-size: 11px; padding: 2px 6px; }
  .archive-folder .folder-name { color: var(--ink); font-weight: 600; word-break: break-all; }
  .archived-banner { padding: 8px 24px; background: var(--banner-bg); color: var(--banner-ink); font-size: 13px;
    border-bottom: 1px solid var(--banner-line); }
  .column.readonly .card { cursor: default; }
  .side-footer { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .side-footer button { flex: 1; font-size: 12px; }
  .side-footer button.wide { flex-basis: 100%; }
  .backup-reminder { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.45;
    background: var(--banner-bg); color: var(--banner-ink); border: 1px solid var(--banner-line); }
  .backup-reminder strong { display: block; margin-bottom: 4px; font-size: 13px; }
  .backup-reminder .actions { display: flex; gap: 6px; margin-top: 8px; }
  .backup-reminder .actions button { flex: 1; font-size: 12px; padding: 4px 6px; }
  .backup-status { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; width: 100%; }
  .backup-status.warn { color: var(--over-ink); }
  .app-footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; }
  .app-footer a { color: var(--muted); text-decoration: none; }
  .app-footer a:hover { color: var(--ink); text-decoration: underline; }
  .filter { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .filter select { font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); }
  .filter.active select { border-color: var(--ink); font-weight: 600; }
  .filter .clear { padding: 4px 8px; }

  /* Pääalue */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 8px; padding: 16px 24px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  header h2 { margin: 0; font-size: 22px; flex: 1; cursor: text; }
  #board {
    flex: 1; display: flex; gap: 16px; padding: 24px; overflow-x: auto; align-items: flex-start;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; }

  .column {
    width: 280px; flex-shrink: 0; background: var(--col); border-radius: 10px;
    display: flex; flex-direction: column; max-height: 100%;
  }
  .column-head {
    display: flex; align-items: center; padding: 10px 10px 6px 14px; gap: 4px;
  }
  .column-head h3 { margin: 0; font-size: 14px; flex: 1; cursor: text; }
  .column-head .count { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .cards { padding: 4px 10px; min-height: 30px; overflow-y: auto; flex: 1; }
  .cards.drag-over { background: var(--hover); border-radius: 6px; }
  .card {
    background: var(--panel); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
    box-shadow: var(--shadow); cursor: grab; border-left: 4px solid transparent;
  }
  .card:hover { box-shadow: var(--shadow-hover); }
  .card.dragging { opacity: .4; }
  .card .title { font-size: 14px; word-wrap: break-word; }
  .card .desc { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .add-card { margin: 4px 10px 10px; text-align: left; border: none; background: none; color: var(--muted); }
  .add-card:hover { background: var(--hover); color: var(--ink); }
  .add-column {
    width: 280px; flex-shrink: 0; border: 2px dashed var(--line); background: none;
    color: var(--muted); padding: 14px; border-radius: 10px;
  }

  /* Dialogi */
  dialog {
    border: none; border-radius: 10px; padding: 24px; width: min(480px, 90vw);
    box-shadow: 0 10px 40px rgba(0,0,0,.2); background: var(--panel); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 16px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .colors { display: flex; gap: 6px; }
  .colors span {
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
  }
  .colors span.selected { border-color: var(--ink); }
  .dialog-actions { display: flex; gap: 8px; margin-top: 20px; }
  .dialog-actions .spacer { flex: 1; }

  /* Näkymävalitsin */
  .view-toggle { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .view-toggle button { border: none; border-radius: 0; }
  .view-toggle button.on { background: var(--ink); color: var(--panel); }

  /* RACI-merkit */
  .badge {
    display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600;
    border-radius: 4px; padding: 2px 5px; color: #fff; line-height: 1.2;
  }
  .role-R { background: #3b7dd8; }
  .role-A { background: #d9534f; }
  .role-C { background: #e09a2d; }
  .role-I { background: #8a857a; }
  .card .raci { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

  /* Tärkeys */
  .prio { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
    border-radius: 4px; padding: 1px 5px; color: #fff; line-height: 1.3; vertical-align: 1px; margin-right: 6px; }
  .prio-P0 { background: #c62828; }
  .prio-P1 { background: #e8590c; }
  .prio-P2 { background: #d4a017; }
  .prio-P3 { background: #3b7dd8; }
  .prio-P4 { background: #8a857a; }
  .prio-pick { display: flex; gap: 3px; }
  .prio-pick button { flex: 1; padding: 4px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
  .prio-pick button.on { color: #fff; border-color: transparent; }
  .prio-pick button.on.none { color: var(--panel); background: var(--ink); }
  .cal-item .prio { font-size: 9px; padding: 0 4px; margin-right: 4px; }
  .matrix td.task .prio { margin-right: 6px; }

  /* Deadline */
  .due { display: inline-block; font-size: 11px; margin-top: 6px; padding: 2px 6px; border-radius: 4px;
    background: var(--bg); color: var(--muted); }
  .due.soon { background: var(--soon-bg); color: var(--soon-ink); }
  .due.overdue { background: var(--over-bg); color: var(--over-ink); font-weight: 600; }
  .due.done { background: var(--done-bg); color: var(--done-ink); }

  /* Valmiusaste */
  .progress { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .progress .bar { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .progress .fill { height: 100%; background: #3b7dd8; border-radius: 3px; }
  .progress.full .fill { background: #5cb85c; }
  .progress .pct { font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }
  input[type=range] { padding: 0; border: none; background: none; accent-color: var(--ink); }
  .progress-quick { display: flex; gap: 4px; margin-top: 4px; }
  .progress-quick button { flex: 1; font-size: 11px; padding: 2px 0; }
  .matrix td.pct { font-size: 12px; white-space: nowrap; }
  .cal-item .pct { font-size: 10px; opacity: .7; margin-left: 4px; }

  /* Kalenteri */
  .calendar { flex: 1; display: flex; flex-direction: column; min-width: 720px; }
  .cal-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cal-toolbar h3 { margin: 0 8px; font-size: 18px; min-width: 180px; text-align: center; text-transform: capitalize; }
  .cal-grid { display: grid; grid-template-columns: 36px repeat(7, 1fr); background: var(--line); gap: 1px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cal-grid .dow { background: var(--col); font-size: 12px; font-weight: 600; padding: 6px; text-align: center; }
  .cal-grid .wk { background: var(--col); font-size: 11px; color: var(--muted); padding: 6px 2px; text-align: center; }
  .cal-day { background: var(--panel); min-height: 96px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
  .cal-day.other { background: var(--cal-other); }
  .cal-day.other .num { opacity: .4; }
  .cal-day.weekend { background: var(--cal-weekend); }
  .cal-day.today .num { background: var(--ink); color: var(--panel); border-radius: 50%; }
  .cal-day.drag-over { background: var(--drop); }
  .cal-day .day-head { display: flex; justify-content: space-between; align-items: center; }
  .cal-day .num { font-size: 12px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
  .cal-day .add { visibility: hidden; padding: 0 6px; font-size: 14px; }
  .cal-day:hover .add { visibility: visible; }
  .cal-item { font-size: 12px; padding: 3px 6px; border-radius: 4px; background: var(--bg);
    border-left: 3px solid var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-item:hover { background: var(--col); }
  .cal-item.overdue { color: var(--over-ink); font-weight: 600; }
  .cal-item.done { text-decoration: line-through; opacity: .6; }
  .cal-nodate { margin-top: 16px; }
  .cal-nodate h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .cal-nodate .items { display: flex; flex-wrap: wrap; gap: 6px; }
  .cal-nodate .cal-item { max-width: 220px; }

  /* RACI kortin dialogissa */
  .raci-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .raci-row .name { flex: 1; font-size: 14px; }
  .raci-pick { display: flex; gap: 3px; }
  .raci-pick button { width: 30px; padding: 4px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
  .raci-pick button.on { color: #fff; border-color: transparent; }
  .hint { font-size: 12px; color: var(--muted); }

  /* Henkilödialogi */
  .person-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .person-row input { flex: 1; }

  /* RACI-matriisi */
  .matrix-wrap { flex: 1; overflow: auto; }
  .matrix { border-collapse: collapse; background: var(--panel); box-shadow: var(--shadow); border-radius: 8px; }
  .matrix th, .matrix td { border: 1px solid var(--line); padding: 8px 10px; font-size: 13px; text-align: center; }
  .matrix th { background: var(--col); font-weight: 600; position: sticky; top: 0; }
  .matrix td.task { text-align: left; min-width: 220px; cursor: pointer; }
  .matrix td.task:hover { text-decoration: underline; }
  .matrix tr.group td { background: var(--bg); text-align: left; font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .matrix td.cell { cursor: pointer; width: 56px; user-select: none; }
  .matrix td.cell:hover { background: var(--bg); }
  .matrix td.warn { color: var(--accent); font-size: 12px; text-align: left; white-space: nowrap; }
  /* Gantt */
  .gantt { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; }
  .gantt-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .gantt-scroll { overflow: auto; min-height: 0; flex: 0 1 auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); }
  .g-head { display: flex; position: sticky; top: 0; z-index: 4; background: var(--col); border-bottom: 1px solid var(--line); }
  .g-corner { position: sticky; left: 0; z-index: 5; background: var(--col); flex-shrink: 0; font-size: 12px; font-weight: 600;
    padding: 6px 10px; display: flex; align-items: flex-end; border-right: 1px solid var(--line); }
  .g-months, .g-days { display: flex; }
  .g-month { font-size: 12px; font-weight: 600; padding: 4px 6px; border-left: 1px solid var(--line); white-space: nowrap;
    overflow: clip; text-transform: capitalize; flex-shrink: 0; }
  .g-month span { position: sticky; left: 250px; }
  .g-day { font-size: 10px; color: var(--muted); text-align: center; padding: 2px 0 4px; flex-shrink: 0; }
  .g-day.weekend { background: var(--hover); }
  .g-day.today { color: var(--panel); background: var(--accent); font-weight: 700; }
  .g-body { position: relative; }
  .g-row { display: flex; border-bottom: 1px solid var(--line); }
  .g-name { position: sticky; left: 0; z-index: 3; background: var(--panel); flex-shrink: 0; padding: 0 10px; height: 100%;
    display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: grab; user-select: none; touch-action: none;
    border-right: 1px solid var(--line); overflow: hidden; white-space: nowrap; }
  .g-name:hover { background: var(--bg); }
  .g-name .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .g-name .c { font-size: 11px; color: var(--muted); }
  .g-name.done .t { text-decoration: line-through; color: var(--muted); }
  .g-name.drop-ok, .g-bar.drop-ok { outline: 2px solid #3b7dd8; outline-offset: -2px; }
  .g-name.drop-bad, .g-bar.drop-bad { outline: 2px solid var(--accent); outline-offset: -2px; cursor: not-allowed; }
  .g-overlay { position: absolute; top: 0; bottom: 0; z-index: 1; }
  .g-weekend { position: absolute; top: 0; bottom: 0; background: var(--hover); }
  .g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .6; }
  .g-svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; color: var(--muted); }
  .g-svg .dep { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .g-svg .dep.bad { stroke: var(--accent); }
  .g-svg .hit { fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke; cursor: pointer; }
  .g-svg .hit:hover + .dep { stroke: var(--ink); stroke-width: 2.5; }
  .g-svg .tmp { fill: none; stroke: #3b7dd8; stroke-width: 2; stroke-dasharray: 5 4; }
  .g-bar, .g-sample { background-color: #3b7dd8; border-radius: 5px; }
  .g-bar { position: absolute; height: 22px; color: #fff; font-size: 11px; display: flex; align-items: center; padding: 0 6px;
    overflow: hidden; cursor: grab; user-select: none; touch-action: none; box-shadow: var(--shadow); }
  .g-bar .fill { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(255,255,255,.3); }
  .g-bar .lbl { position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-bar.auto, .g-sample.auto { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.25) 0 5px, transparent 5px 10px); }
  .g-bar.done, .g-sample.done { opacity: .45; }
  .g-bar.late, .g-sample.late { box-shadow: 0 0 0 2px var(--accent); }
  .g-bar.dragging, .g-name.dragging { cursor: grabbing; opacity: .7; }
  .g-sample { display: inline-block; width: 28px; height: 12px; vertical-align: middle; }
  .gantt .cal-nodate button { font-size: 12px; padding: 3px 8px; }

  /* Kortin lisäkentät */
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; min-width: 0; }
  .deps-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .dep-chip { display: inline-flex; align-items: center; font-size: 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 2px 2px 2px 10px; }
  .dep-chip.done { text-decoration: line-through; color: var(--muted); }
  .dep-chip button { border: none; background: none; padding: 0 6px; color: var(--muted); }
  select.dep-add { font: inherit; width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--input); color: var(--ink); }
  dialog label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; margin-top: 14px; }
  dialog label.check input { width: auto; margin: 0; }
  .card .waiting { font-size: 11px; color: var(--soon-ink); margin-top: 6px; }
  .legend { display: flex; gap: 14px; margin-bottom: 14px; font-size: 13px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>

<aside>
  <h1>▦ Raciban <button class="icon theme-toggle" id="themeToggle"></button></h1>
  <h2>Projektit</h2>
  <ul id="projectList"></ul>
  <button class="primary" id="addProject">+ Uusi projekti</button>
  <details id="archiveSection">
    <summary id="archiveSummary">Arkisto</summary>
    <div class="archive-folder" id="archiveFolder"></div>
    <ul id="archiveList"></ul>
  </details>
  <div class="backup-reminder" id="backupReminder" hidden></div>
  <div class="side-footer">
    <button id="exportAllSeparate" class="wide" title="Tallentaa jokaisen projektin ja arkistoidun projektin omaksi JSON-tiedostokseen">⬇ Vie kaikki erillisinä tiedostoina</button>
    <button id="exportBtn" title="Lataa kaikki data yhtenä JSON-varmuuskopiona">Vie varmuuskopio</button>
    <button id="importBtn" title="Tuo varmuuskopio tai yksi/useampi projektitiedosto">Tuo</button>
    <input type="file" id="importFile" accept=".json,application/json" multiple hidden>

<main>
  <header id="header"></header>
  <div id="banner"></div>
  <div id="board"></div>
</main>

<dialog id="cardDialog">
  <form method="dialog" id="cardForm">
    <h3 id="cardDialogTitle">Kortti</h3>
    <label for="cardTitle">Otsikko</label>
    <input id="cardTitle" required autocomplete="off">
    <label for="cardDesc">Kuvaus</label>
    <textarea id="cardDesc"></textarea>
    <div class="field-row">
      <div>
        <label for="cardDue">Deadline</label>
        <div style="display:flex;gap:6px">
          <input type="date" id="cardDue" style="flex:1">
          <button type="button" id="clearDue" title="Poista deadline">✕</button>
        </div>
      </div>
      <div style="flex:0 0 110px">
        <label for="cardDuration">Kesto (pv)</label>
        <input type="number" id="cardDuration" min="1" max="999" value="1" title="Tehtävän kesto päivinä Gantt-kaaviossa">
      </div>
    </div>
    <label>Tärkeys</label>
    <div class="prio-pick" id="cardPriority"></div>
    <label for="cardProgress">Valmiusaste: <strong id="progressVal">0 %</strong></label>

    <div class="progress-quick" id="progressQuick"></div>
    <label>Edeltävät tehtävät <span title="Tehtävä voi alkaa, kun nämä ovat valmiita">ⓘ</span></label>
