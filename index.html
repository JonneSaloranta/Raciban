<dialog id="peopleDialog">
  <h3>Projektin henkilöt</h3>
  <div id="peopleList"></div>
  <form id="addPersonForm" class="person-row" style="margin-top:12px">
    <input id="newPerson" placeholder="Uuden henkilön nimi" autocomplete="off">
    <button type="submit" class="primary">Lisää</button>
  </form>
  <div class="dialog-actions">
    <span class="spacer"></span>
    <button type="button" id="closePeople">Valmis</button>
  </div>
</dialog>

<script>
const STORAGE_KEY = 'simple-kanban-v1';
const COLORS = ['transparent', '#d9534f', '#f0ad4e', '#5cb85c', '#5bc0de', '#7e57c2'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- Tila ----------
let state = load();

const ROLES = {
  R: 'Responsible – tekee työn',
  A: 'Accountable – hyväksyy, lopullinen vastuu',
  C: 'Consulted – konsultoidaan',
  I: 'Informed – pidetään ajan tasalla',
};
const ROLE_ORDER = ['R', 'A', 'C', 'I'];

const PRIORITIES = {
  P0: 'P0 – kriittinen, heti',
  P1: 'P1 – korkea',
  P2: 'P2 – normaali',
  P3: 'P3 – matala',
  P4: 'P4 – joskus / ei kiireellinen',
};
const prioBadge = prio => el('span', { className: `prio prio-${prio}`, textContent: prio, title: `Tärkeys: ${PRIORITIES[prio]}` });

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && Array.isArray(data.projects)) return normalize(data);
  } catch {}
  return { projects: [], archive: [], activeId: null, archiveViewId: null, view: 'board' };
}

// Täydentää vanhemmasta versiosta puuttuvat kentät
function normalize(data) {
  data.view ??= 'board';
  data.archive ??= [];
  data.archiveViewId ??= null;
  for (const p of [...data.projects, ...data.archive]) {
    p.people ??= [];
    for (const col of p.columns) for (const card of col.cards) card.raci ??= {};
  }
  return data;
}

// Asettaa roolin; kullakin tehtävällä voi olla vain yksi A
function setRole(raci, personId, role) {
  if (!role) { delete raci[personId]; return; }
  if (role === 'A') for (const id in raci) if (raci[id] === 'A') delete raci[id];
  raci[personId] = role;
}

function raciWarnings(card) {
  const roles = Object.values(card.raci);
  const w = [];
  if (!roles.includes('A')) w.push('Ei A:ta');
  if (!roles.includes('R')) w.push('Ei R:ää');
  return w;
}

// Henkilösuodatin (ei tallenneta, projektikohtainen istunnon ajan)
const filters = {}; // projectId -> { person: '' | personId | '__none__', role: '' | 'R'|'A'|'C'|'I' }
const getFilter = p => (filters[p.id] ??= { person: '', role: '' });
const filterActive = p => !!getFilter(p).person;

function cardVisible(p, card) {
  const { person, role } = getFilter(p);
  if (!person) return true;
  if (person === '__none__') return Object.keys(card.raci).length === 0;
  const r = card.raci[person];
  return role ? r === role : !!r;
}

function renderFilter(p) {
  const f = getFilter(p);
  // Poistettu henkilö → nollaa suodatin
  if (f.person && f.person !== '__none__' && !p.people.some(x => x.id === f.person)) f.person = '';

  const person = el('select', { title: 'Näytä vain valitun henkilön tehtävät' });
  person.append(el('option', { value: '', textContent: 'Kaikki henkilöt' }));
  for (const pp of p.people) person.append(el('option', { value: pp.id, textContent: pp.name }));
  person.append(el('option', { value: '__none__', textContent: '– Ei vastuuhenkilöä –' }));
  person.value = f.person;
  person.onchange = () => { f.person = person.value; if (!f.person || f.person === '__none__') f.role = ''; render(); };

  const wrap = el('div', { className: 'filter' + (f.person ? ' active' : '') }, '🔍', person);

  if (f.person && f.person !== '__none__') {
    const role = el('select', { title: 'Rajaa roolin mukaan' });
    role.append(el('option', { value: '', textContent: 'Kaikki roolit' }));
    for (const r of ROLE_ORDER) role.append(el('option', { value: r, textContent: `${r} – ${ROLES[r].split(' – ')[0]}` }));
    role.value = f.role;
    role.onchange = () => { f.role = role.value; render(); };
    wrap.append(role);
  }
  if (f.person) {
    const clear = el('button', { className: 'clear', textContent: '✕', title: 'Poista suodatin' });
    clear.onclick = () => { f.person = ''; f.role = ''; render(); };
    wrap.append(clear);
  }
  return wrap;
}

// ---------- Päivämäärät ----------
const pad = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // paikallinen YYYY-MM-DD
const todayStr = () => dateStr(new Date());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysUntil = s => Math.round((parseDate(s) - parseDate(todayStr())) / 864e5);
const fmtDue = s => {
  const d = parseDate(s);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('fi-FI', { weekday: 'short', day: 'numeric', month: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
};
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
// Viimeinen sarake tulkitaan "valmiiksi" – sen korteista ei varoiteta myöhästymisestä
const isDoneCol = (p, col) => p.columns.at(-1) === col;

// Palauttaa { cls, text, title } kortin deadline-merkille
function dueInfo(card, done) {
  if (!card.due) return null;
  const n = daysUntil(card.due);
  const rel = n === 0 ? 'tänään' : n === 1 ? 'huomenna' : n === -1 ? 'eilen' : n < 0 ? `${-n} pv myöhässä` : `${n} pv`;
  const cls = done ? 'done' : n < 0 ? 'overdue' : n <= 2 ? 'soon' : '';
  return { cls, text: `📅 ${fmtDue(card.due)}`, title: `Deadline ${fmtDue(card.due)} (${rel})` };
}

function progressBar(pct) {
  const fill = el('div', { className: 'fill' });
  fill.style.width = pct + '%';
  return el('div', { className: 'progress' + (pct >= 100 ? ' full' : ''), title: `Valmiusaste ${pct} %` },
    el('div', { className: 'bar' }, fill), el('span', { className: 'pct', textContent: pct + ' %' }));
}

const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join('');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  markChanged();
}

const activeProject = () => state.projects.find(p => p.id === state.activeId);
const archivedProject = () => state.archive.find(p => p.id === state.archiveViewId);
const fmtDate = iso => new Date(iso).toLocaleDateString('fi-FI');

function newProject(name) {
  return {
    id: uid(),
    name,
    people: [],
    columns: ['Tehtävänä', 'Työn alla', 'Valmis'].map(title => ({ id: uid(), title, cards: [] })),
  };
}

// ---------- Renderöinti ----------
const $ = sel => document.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
};

function render() {
  renderProjects();
  renderArchiveList();
  $('#banner').innerHTML = '';
  if (archivedProject()) { renderArchiveView(archivedProject()); return; }
  renderHeader();
  renderBoard();
}

function renderProjects() {
  const list = $('#projectList');
  list.innerHTML = '';
  for (const p of state.projects) {
    const total = p.columns.reduce((n, c) => n + c.cards.length, 0);
    const li = el('li', { className: p.id === state.activeId && !archivedProject() ? 'active' : '' },
      el('span', { textContent: p.name }),
      el('span', { className: 'count', textContent: total }));
    li.onclick = () => { state.activeId = p.id; state.archiveViewId = null; save(); render(); };
    list.append(li);
  }
}

function renderArchiveList() {
  const list = $('#archiveList');
  list.innerHTML = '';
  $('#archiveSummary').textContent = `Arkisto (${state.archive.length})`;
  if (!state.archive.length) list.append(el('li', { textContent: 'Ei arkistoituja projekteja', style: 'cursor:default' }));
  const sorted = [...state.archive].sort((a, b) => b.archivedAt.localeCompare(a.archivedAt));
  for (const p of sorted) {
    const li = el('li', { className: p.id === state.archiveViewId ? 'active' : '', title: 'Näytä arkistoitu projekti' },
      el('span', { textContent: p.name + (p.archiveFile ? '' : ' ⚠') }),
      el('span', { className: 'date', textContent: fmtDate(p.archivedAt) }));
    if (!p.archiveFile) li.title = 'Ei tallennettu tiedostoksi';
    li.onclick = () => { state.archiveViewId = p.id; save(); render(); };
    list.append(li);
  }
}

function renderHeader() {
  const header = $('#header');
  header.innerHTML = '';
  const p = activeProject();
  if (!p) return;
  const title = el('h2', { textContent: p.name, title: 'Klikkaa nimetäksesi uudelleen' });
  title.onclick = () => {
    const name = prompt('Projektin nimi:', p.name);
    if (name?.trim()) { p.name = name.trim(); save(); render(); }
  };
  const del = el('button', { className: 'danger', textContent: 'Poista projekti' });
  del.onclick = () => {
    if (!confirm(`Poistetaanko projekti "${p.name}" ja kaikki sen kortit?`)) return;
    state.projects = state.projects.filter(x => x.id !== p.id);
    state.activeId = state.projects[0]?.id ?? null;
    save(); render();
  };
  const toggle = el('div', { className: 'view-toggle' });
  for (const [view, label] of [['board', 'Taulu'], ['calendar', 'Kalenteri'], ['gantt', 'Gantt'], ['raci', 'RACI-matriisi']]) {
    const b = el('button', { textContent: label, className: state.view === view ? 'on' : '' });
    b.onclick = () => { state.view = view; save(); render(); };
    toggle.append(b);
  }
  const people = el('button', { textContent: `👥 Henkilöt (${p.people.length})` });
  people.onclick = openPeopleDialog;
  const archive = el('button', { textContent: '📦 Arkistoi', title: 'Siirrä projekti arkistoon' });
  archive.onclick = () => archiveProject(p);
  header.append(title, renderFilter(p), toggle, people, archive, del);
}

function renderBoard() {
  const board = $('#board');
  board.innerHTML = '';
  const p = activeProject();
  if (!p) {
    board.append(el('div', { className: 'empty' },
      el('p', { textContent: 'Ei valittua projektia.' }),
      el('p', { textContent: 'Luo uusi projekti vasemmalta.' })));
    return;
  }
  if (state.view === 'raci') { renderMatrix(p, board); return; }
  if (state.view === 'calendar') { renderCalendar(p, board); return; }
  if (state.view === 'gantt') { renderGantt(p, board); return; }

  for (const col of p.columns) board.append(renderColumn(p, col));

  const addCol = el('button', { className: 'add-column', textContent: '+ Lisää sarake' });
  addCol.onclick = () => {
    const title = prompt('Sarakkeen nimi:');
    if (title?.trim()) { p.columns.push({ id: uid(), title: title.trim(), cards: [] }); save(); render(); }
  };
  board.append(addCol);
}

function visibleCount(p, col) {
  const n = col.cards.filter(c => cardVisible(p, c)).length;
  return filterActive(p) ? `${n}/${col.cards.length}` : n;
}

function renderColumn(project, col) {
  const title = el('h3', { textContent: col.title, title: 'Klikkaa nimetäksesi uudelleen' });
  title.onclick = () => {
    const t = prompt('Sarakkeen nimi:', col.title);
    if (t?.trim()) { col.title = t.trim(); save(); render(); }
  };

  const left = el('button', { className: 'icon', textContent: '‹', title: 'Siirrä vasemmalle' });
  const right = el('button', { className: 'icon', textContent: '›', title: 'Siirrä oikealle' });
  const idx = project.columns.indexOf(col);
  left.disabled = idx === 0;
  right.disabled = idx === project.columns.length - 1;
  left.onclick = () => moveColumn(project, idx, -1);
  right.onclick = () => moveColumn(project, idx, 1);

  const del = el('button', { className: 'icon', textContent: '✕', title: 'Poista sarake' });
  del.onclick = () => {
    if (col.cards.length && !confirm(`Sarakkeessa "${col.title}" on ${col.cards.length} korttia. Poistetaanko?`)) return;
    project.columns = project.columns.filter(c => c.id !== col.id);
    save(); render();
  };

  const head = el('div', { className: 'column-head' },
    title, el('span', { className: 'count', textContent: visibleCount(project, col) }), left, right, del);

  const cards = el('div', { className: 'cards' });
  cards.dataset.colId = col.id;
  for (const card of col.cards) if (cardVisible(project, card)) cards.append(renderCard(card, project, false, isDoneCol(project, col)));
  setupDropZone(cards);

  const add = el('button', { className: 'add-card', textContent: '+ Lisää kortti' });
  add.onclick = () => openCardDialog(col.id, null);

  return el('div', { className: 'column' }, head, cards, add);
}

function renderCard(card, project, readOnly = false, done = false) {
  const people = project.people;
  const titleEl = el('div', { className: 'title' });
  if (card.priority) titleEl.append(prioBadge(card.priority));
  titleEl.append(card.title);
  const div = el('div', { className: 'card', draggable: !readOnly }, titleEl);
  if (card.desc) div.append(el('div', { className: 'desc', textContent: card.desc }));
  if (card.progress) div.append(progressBar(card.progress));
  const due = dueInfo(card, done || readOnly);
  if (due) div.append(el('div', {}, el('span', { className: `due ${readOnly ? '' : due.cls}`, textContent: due.text, title: due.title })));
  if (!readOnly && !done) {
    const waiting = depsOf(card).map(id => findCard(project, id)).filter(f => f && !isDoneCol(project, f.col));
    if (waiting.length) div.append(el('div', { className: 'waiting', title: 'Keskeneräiset edeltävät tehtävät',
      textContent: `⏳ Odottaa: ${waiting.map(f => f.card.title).join(', ')}` }));
  }
  const assigned = people.filter(pp => card.raci[pp.id])
    .sort((a, b) => ROLE_ORDER.indexOf(card.raci[a.id]) - ROLE_ORDER.indexOf(card.raci[b.id]));
  if (assigned.length) {
    const raci = el('div', { className: 'raci' });
    for (const person of assigned) {
      const role = card.raci[person.id];
      raci.append(el('span', {
        className: `badge role-${role}`,
        textContent: `${role} · ${initials(person.name)}`,
        title: `${person.name}: ${ROLES[role]}`,
      }));
    }
    div.append(raci);
  }
  if (card.color && card.color !== 'transparent') div.style.borderLeftColor = card.color;
  div.dataset.cardId = card.id;
  if (readOnly) return div;
  div.onclick = () => openCardDialog(null, card.id);
  div.ondragstart = e => {
    e.dataTransfer.setData('text/plain', card.id);
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => div.classList.add('dragging'));
  };
  div.ondragend = () => div.classList.remove('dragging');
  return div;
}

function moveColumn(project, idx, dir) {
  const cols = project.columns;
  [cols[idx], cols[idx + dir]] = [cols[idx + dir], cols[idx]];
  save(); render();
}

// ---------- Kalenteri ----------
let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();

function calItem(p, col, card) {
  const done = isDoneCol(p, col);
  const due = card.due ? dueInfo(card, done) : null;
  const item = el('div', {
    className: 'cal-item' + (due?.cls === 'overdue' ? ' overdue' : '') + (done ? ' done' : ''),
    draggable: true,
  });
  if (card.priority) item.append(prioBadge(card.priority));
  item.append(card.title);
  if (card.progress) item.append(el('span', { className: 'pct', textContent: card.progress + ' %' }));
  const roles = p.people.filter(x => card.raci[x.id]).map(x => `${card.raci[x.id]}: ${x.name}`);
  item.title = [card.title, `Sarake: ${col.title}`, card.priority ? `Tärkeys: ${PRIORITIES[card.priority]}` : '', due?.title, card.progress ? `Valmiusaste ${card.progress} %` : '', ...roles].filter(Boolean).join('\n');
  if (card.color && card.color !== 'transparent') item.style.borderLeftColor = card.color;
  item.onclick = () => openCardDialog(null, card.id);
  item.ondragstart = e => { e.dataTransfer.setData('text/plain', card.id); e.dataTransfer.effectAllowed = 'move'; };
  return item;
}

function calDropZone(zone, p, date) {
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
  zone.ondragleave = e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); };
  zone.ondrop = e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const found = findCard(p, e.dataTransfer.getData('text/plain'));
    if (!found) return;
    if (date) found.card.due = date; else delete found.card.due;
    save(); render();
  };
}

function renderCalendar(p, board) {
  const cal = el('div', { className: 'calendar' });
  board.append(cal);

  // Työkalurivi
  const prev = el('button', { textContent: '‹', title: 'Edellinen kuukausi' });
  const next = el('button', { textContent: '›', title: 'Seuraava kuukausi' });
  const today = el('button', { textContent: 'Tänään' });
  prev.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); render(); };
  next.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); render(); };
  today.onclick = () => { const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); render(); };
  const monthName = calMonth.toLocaleDateString('fi-FI', { month: 'long', year: 'numeric' });
  cal.append(el('div', { className: 'cal-toolbar' }, prev, el('h3', { textContent: monthName }), next, today,
    el('span', { className: 'hint', textContent: 'Raahaa tehtävä päivälle muuttaaksesi deadlinea.' })));

  // Kortit päivittäin (suodatin huomioiden)
  const byDate = {};
  const noDate = [];
  for (const col of p.columns) for (const card of col.cards) {
    if (!cardVisible(p, card)) continue;
    if (card.due) (byDate[card.due] ??= []).push({ col, card });
    else noDate.push({ col, card });
  }

  const grid = el('div', { className: 'cal-grid' });
  grid.append(el('div', { className: 'dow', textContent: 'Vk' }));
  for (const d of ['Ma', 'Ti', 'Ke', 'To', 'Pe', 'La', 'Su']) grid.append(el('div', { className: 'dow', textContent: d }));

  // Alkaa kuukauden ensimmäistä päivää edeltävästä maanantaista, päättyy viimeisen päivän jälkeiseen sunnuntaihin
  const start = new Date(calMonth);
  start.setDate(1 - ((start.getDay() + 6) % 7));
  const last = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
  const end = new Date(last);
  end.setDate(last.getDate() + (7 - ((last.getDay() + 6) % 7) - 1));
  const today_ = todayStr();

  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if ((d.getDay() + 6) % 7 === 0) grid.append(el('div', { className: 'wk', textContent: isoWeek(d) }));
    const ds = dateStr(d);
    const cls = ['cal-day'];
    if (d.getMonth() !== calMonth.getMonth()) cls.push('other');
    if (d.getDay() === 0 || d.getDay() === 6) cls.push('weekend');
    if (ds === today_) cls.push('today');
    const add = el('button', { className: 'icon add', textContent: '+', title: 'Uusi tehtävä tälle päivälle' });
    add.onclick = () => p.columns.length ? openCardDialog(p.columns[0].id, null, ds) : alert('Lisää projektiin ensin sarake.');
    const cell = el('div', { className: cls.join(' ') },
      el('div', { className: 'day-head' }, el('span', { className: 'num', textContent: d.getDate() }), add));
    for (const { col, card } of byDate[ds] ?? []) cell.append(calItem(p, col, card));
    calDropZone(cell, p, ds);
    grid.append(cell);
  }
  cal.append(grid);

  // Ilman deadlinea – raahaamalla tänne poistuu deadline
  const nd = el('div', { className: 'cal-nodate' }, el('h4', { textContent: `Ilman deadlinea (${noDate.length})` }));
  const items = el('div', { className: 'items' });
  for (const { col, card } of noDate) items.append(calItem(p, col, card));
  if (!noDate.length) items.append(el('span', { className: 'hint', textContent: 'Kaikilla tehtävillä on deadline. Raahaa tehtävä tähän poistaaksesi deadlinen.' }));
  nd.append(items);
  calDropZone(nd, p, null);
  cal.append(nd);
}

// ---------- Riippuvuudet ----------
// card.deps = edeltävien tehtävien id:t (ne tehdään ennen tätä tehtävää)
const depsOf = card => card.deps ?? [];

// Riippuuko tehtävä a (suoraan tai välillisesti) tehtävästä b
function dependsOn(p, aId, bId, seen = new Set()) {
  if (aId === bId) return true;
  if (seen.has(aId)) return false;
  seen.add(aId);
  const a = findCard(p, aId)?.card;
  return !!a && depsOf(a).some(id => dependsOn(p, id, bId, seen));
}

// Voiko tehtävästä pred tehdä tehtävän succ edeltäjän (ei itseensä, ei tuplana, ei kehää)
function canDepend(p, predId, succId) {
  const succ = findCard(p, succId)?.card;
  return !!succ && predId !== succId && !depsOf(succ).includes(predId) && !dependsOn(p, predId, succId);
}

function addDependency(p, predId, succId) {
  const succ = findCard(p, succId).card;
  succ.deps = [...depsOf(succ), predId];
  sortByDeps(p);
}

function removeDependency(p, predId, succ) {
  succ.deps = depsOf(succ).filter(id => id !== predId);
  if (!succ.deps.length) delete succ.deps;
}

// Järjestää keskeneräisten sarakkeiden kortit niin, että edeltävät tehtävät ovat ennen niistä riippuvia.
// Muuten nykyinen järjestys säilyy. Viimeistä (valmis-)saraketta ei järjestellä.
function sortByDeps(p) {
  for (const col of p.columns) {
    if (isDoneCol(p, col)) continue;
    const byId = new Map(col.cards.map(c => [c.id, c]));
    const placed = new Set(), out = [];
    const place = (c, path = new Set()) => {
      if (placed.has(c.id) || path.has(c.id)) return;
      path.add(c.id);
      for (const id of depsOf(c)) if (byId.has(id)) place(byId.get(id), path);
      placed.add(c.id);
      out.push(c);
    };
    for (const c of col.cards) place(c);
    col.cards = out;
  }
}

// ---------- Gantt ----------
const G_DAY = 28, G_ROW = 34, G_NAME = 240, G_BAR = 22;
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); };
const dayDiff = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
let ganttScroll = null; // vierityskohta säilyy uudelleenpiirrossa

// Laskee tehtäville alku- ja loppupäivän.
// Deadline määrää loppupäivän, jos se on asetettu. Muuten tehtävä alkaa aikaisintaan tänään
// ja kun keskeneräiset edeltäjät ovat valmiita. Kesto tulee kortilta (oletus 1 pv).
function schedule(p) {
  const info = new Map();
  for (const col of p.columns) for (const card of col.cards) info.set(card.id, { card, col, done: isDoneCol(p, col) });
  const out = new Map();
  const today = todayStr();
  const calc = (id, path) => {
    if (out.has(id)) return out.get(id);
    const { card, done } = info.get(id);
    path.add(id);
    let after = null; // aikaisin aloituspäivä edeltäjien perusteella
    for (const d of depsOf(card)) {
      if (!info.has(d) || path.has(d) || info.get(d).done) continue;
      const next = addDays(calc(d, path).end, 1);
      if (!after || next > after) after = next;
    }
    path.delete(id);
    const dur = card.duration ?? 1;
    let start, end;
    if (card.due) { end = card.due; start = addDays(end, 1 - dur); }
    else { start = !done && after && after > today ? after : today; end = addDays(start, dur - 1); }
    const s = { start, end, dur, done, after, auto: !card.due,
      conflict: !done && !!after && start < after, late: !done && end < today };
    out.set(id, s);
    return s;
  };
  for (const id of info.keys()) calc(id, new Set());
  return { sched: out, info };
}

function renderGantt(p, board) {
  const { sched, info } = schedule(p);
  const visible = [...info.values()].filter(x => cardVisible(p, x.card));
  const rows = visible.filter(x => x.card.gantt !== false);
  const hidden = visible.filter(x => x.card.gantt === false);
  const order = new Map([...info.keys()].map((id, i) => [id, i]));
  rows.sort((a, b) => {
    const sa = sched.get(a.card.id), sb = sched.get(b.card.id);
    return sa.start.localeCompare(sb.start) || sa.end.localeCompare(sb.end) || order.get(a.card.id) - order.get(b.card.id);
  });

  const wrap = el('div', { className: 'gantt' });
  board.append(wrap);
  const todayBtn = el('button', { textContent: 'Tänään' });
  wrap.append(el('div', { className: 'gantt-toolbar' }, todayBtn, el('span', { className: 'hint',
    textContent: 'Raahaa tehtävä toisen tehtävän päälle: raahattu tehtävä tehdään ensin. Klikkaa nuolta poistaaksesi riippuvuuden.' })));
  const sample = (cls, text) => el('span', {}, el('span', { className: `g-sample ${cls}` }), ' ' + text);
  wrap.append(el('div', { className: 'legend' },
    sample('', 'Deadline asetettu'), sample('auto', 'Arvioitu (ei deadlinea)'),
    sample('late', 'Myöhässä tai deadline ennen edeltäjiä'), sample('done', 'Valmis')));

  if (!rows.length) {
    wrap.append(el('p', { className: 'hint', textContent: info.size ? 'Ei näytettäviä tehtäviä.' : 'Projektissa ei ole vielä tehtäviä.' }));
  } else {
    // Aikajana: maanantaista ennen ensimmäistä tehtävää vähintään kuuden viikon ajalle
    const today = todayStr();
    let from = today, to = today;
    for (const r of rows) {
      const s = sched.get(r.card.id);
      if (s.start < from) from = s.start;
      if (s.end > to) to = s.end;
    }
    from = addDays(from, -3);
    from = addDays(from, -((parseDate(from).getDay() + 6) % 7));
    to = addDays(to, 10);
    if (dayDiff(from, to) < 41) to = addDays(from, 41);
    const days = dayDiff(from, to) + 1, W = days * G_DAY;
    const x = d => dayDiff(from, d) * G_DAY;

    // Otsikko: kuukaudet ja päivät
    const months = el('div', { className: 'g-months' }), dayRow = el('div', { className: 'g-days' });
    let mStart = 0;
    for (let i = 0; i < days; i++) {
      const ds = addDays(from, i), d = parseDate(ds);
      const we = d.getDay() === 0 || d.getDay() === 6;
      dayRow.append(el('div', { className: 'g-day' + (we ? ' weekend' : '') + (ds === today ? ' today' : ''),
        textContent: d.getDate(), style: `width:${G_DAY}px`, title: `${fmtDue(ds)}, vk ${isoWeek(d)}` }));
      if (i === days - 1 || parseDate(addDays(ds, 1)).getDate() === 1) {
        months.append(el('div', { className: 'g-month', style: `width:${(i - mStart + 1) * G_DAY}px` },
          el('span', { textContent: d.toLocaleDateString('fi-FI', { month: 'long', year: 'numeric' }) })));
        mStart = i + 1;
      }
    }
    const head = el('div', { className: 'g-head' },
      el('div', { className: 'g-corner', textContent: 'Tehtävä', style: `width:${G_NAME}px` }), el('div', {}, months, dayRow));

    // Tausta: viikonloput ja tämä päivä
    const body = el('div', { className: 'g-body' });
    const overlay = el('div', { className: 'g-overlay', style: `left:${G_NAME}px;width:${W}px` });
    for (let i = 0; i < days; i++) {
      const wd = parseDate(addDays(from, i)).getDay();
      if (wd === 0 || wd === 6) overlay.append(el('div', { className: 'g-weekend', style: `left:${i * G_DAY}px;width:${G_DAY}px` }));
    }
    overlay.append(el('div', { className: 'g-today', style: `left:${x(today)}px`, title: 'Tänään' }));
    const svg = svgEl('svg', { class: 'g-svg', width: W, height: rows.length * G_ROW });
    svg.innerHTML = '<defs>' +
      '<marker id="g-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>' +
      '<marker id="g-arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>' +
      '<marker id="g-arr-tmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b7dd8"/></marker>' +
      '</defs>';
    overlay.append(svg);

    const rowIndex = new Map(rows.map((r, i) => [r.card.id, i]));
    const barEnd = id => ({ x: x(sched.get(id).end) + G_DAY - 2, y: rowIndex.get(id) * G_ROW + G_ROW / 2 });
    const ctx = { p, svg, overlay, barEnd };

    rows.forEach(({ card, col, done }, i) => {
      const s = sched.get(card.id);
      const preds = depsOf(card).map(id => findCard(p, id)?.card.title).filter(Boolean);

      const name = el('div', { className: 'g-name' + (done ? ' done' : ''), style: `width:${G_NAME}px`,
        title: `${card.title}\nSarake: ${col.title}\nKlikkaa avataksesi, raahaa toisen tehtävän päälle tehdäksesi riippuvuuden` });
      if (card.priority) name.append(prioBadge(card.priority));
      name.append(el('span', { className: 't', textContent: card.title }), el('span', { className: 'c', textContent: col.title }));
      name.dataset.cardId = card.id;
      body.append(el('div', { className: 'g-row', style: `height:${G_ROW}px` }, name, el('div', { style: `width:${W}px` })));
      ganttDrag(ctx, name, card);

      const cls = ['g-bar', s.auto && 'auto', done && 'done', (s.late || s.conflict) && 'late'].filter(Boolean).join(' ');
      const bar = el('div', { className: cls,
        style: `left:${x(s.start) + 2}px;width:${s.dur * G_DAY - 4}px;top:${i * G_ROW + (G_ROW - G_BAR) / 2}px` });
      if (card.color && card.color !== 'transparent') bar.style.backgroundColor = card.color;
      const fill = el('div', { className: 'fill' });
      fill.style.width = (card.progress ?? 0) + '%';
      bar.append(fill, el('span', { className: 'lbl', textContent: card.title }));
      bar.title = [
        card.title,
        `${fmtDue(s.start)} – ${fmtDue(s.end)} (${s.dur} pv)`,
        card.due ? `Deadline ${fmtDue(card.due)}` : 'Ei deadlinea – ajoitus arvioitu',
        card.progress ? `Valmiusaste ${card.progress} %` : '',
        preds.length ? `Edeltävät: ${preds.join(', ')}` : '',
        s.conflict ? `⚠ Edeltävät tehtävät valmistuvat vasta ${fmtDue(addDays(s.after, -1))}` : '',
        s.late ? '⚠ Myöhässä' : '',
      ].filter(Boolean).join('\n');
      bar.dataset.cardId = card.id;
      ganttDrag(ctx, bar, card);
      overlay.append(bar);
    });

    // Riippuvuusnuolet
    for (const { card } of rows) for (const predId of depsOf(card)) {
      if (!rowIndex.has(predId)) continue;
      const ps = sched.get(predId), ss = sched.get(card.id);
      const { x: x1, y: y1 } = barEnd(predId);
      const x2 = x(ss.start) + 2, y2 = rowIndex.get(card.id) * G_ROW + G_ROW / 2;
      const dx = Math.max(24, Math.abs(x2 - x1) / 2);
      const d = `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      const bad = !ss.done && !ps.done && ss.start <= ps.end;
      const pred = findCard(p, predId).card;
      const hit = svgEl('path', { d, class: 'hit' });
      hit.append(svgEl('title'));
      hit.firstChild.textContent = `${pred.title} → ${card.title}\nKlikkaa poistaaksesi riippuvuuden`;
      hit.onclick = () => {
        if (!confirm(`Poistetaanko riippuvuus?\n\n"${pred.title}" ennen tehtävää "${card.title}"`)) return;
        removeDependency(p, predId, card);
        save(); render();
      };
      svg.append(hit, svgEl('path', { d, class: 'dep' + (bad ? ' bad' : ''), 'marker-end': `url(#${bad ? 'g-arr-bad' : 'g-arr'})` }));
    }

    body.append(overlay);
    const scroll = el('div', { className: 'gantt-scroll' }, el('div', { style: `width:${G_NAME + W}px` }, head, body));
    wrap.append(scroll);
    const toToday = () => { scroll.scrollLeft = x(today) - 3 * G_DAY; };
    todayBtn.onclick = toToday;
    if (ganttScroll?.id === p.id) { scroll.scrollLeft = ganttScroll.left; scroll.scrollTop = ganttScroll.top; }
    else toToday();
    scroll.onscroll = () => { ganttScroll = { id: p.id, left: scroll.scrollLeft, top: scroll.scrollTop }; };
  }

  // Gantt-kaaviosta piilotetut tehtävät
  if (hidden.length) {
    const items = el('div', { className: 'items' });
    for (const { card } of hidden) {
      const b = el('button', { textContent: '+ ' + card.title, title: 'Näytä Gantt-kaaviossa' });
      b.onclick = () => { delete card.gantt; save(); render(); };
      items.append(b);
    }
    wrap.append(el('div', { className: 'cal-nodate' }, el('h4', { textContent: `Piilotettu Gantt-kaaviosta (${hidden.length})` }), items));
  }
}

// Raahaus Gantt-kaaviossa: pudotus toisen tehtävän päälle tekee raahatusta tehtävästä sen edeltäjän.
// Pelkkä klikkaus avaa kortin.
function ganttDrag(ctx, handle, card) {
  handle.onpointerdown = e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let line = null, target = null, ok = false;
    const clear = () => document.querySelectorAll('.drop-ok, .drop-bad').forEach(n => n.classList.remove('drop-ok', 'drop-bad'));
    const move = ev => {
      if (!line) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
        line = svgEl('path', { class: 'tmp', 'marker-end': 'url(#g-arr-tmp)' });
        ctx.svg.append(line);
        handle.classList.add('dragging');
      }
      const r = ctx.overlay.getBoundingClientRect(), from = ctx.barEnd(card.id);
      line.setAttribute('d', `M${from.x} ${from.y} L${ev.clientX - r.left} ${ev.clientY - r.top}`);
      clear();
      const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.gantt [data-card-id]');
      target = t && t.dataset.cardId !== card.id ? t.dataset.cardId : null;
      if (!target) return;
      ok = canDepend(ctx.p, card.id, target);
      document.querySelectorAll(`.gantt [data-card-id="${target}"]`).forEach(n => n.classList.add(ok ? 'drop-ok' : 'drop-bad'));
    };
    const up = ev => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      removeEventListener('pointercancel', up);
      clear();
      if (!line) { if (ev.type === 'pointerup') openCardDialog(null, card.id); return; }
      line.remove();
      handle.classList.remove('dragging');
      if (ev.type === 'pointerup' && target && ok) { addDependency(ctx.p, card.id, target); save(); render(); }
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    addEventListener('pointercancel', up);
  };
}

// ---------- RACI-matriisi ----------
function renderMatrix(p, board) {
  const wrap = el('div', { className: 'matrix-wrap' });
  board.append(wrap);

  const legend = el('div', { className: 'legend' });
  for (const r of ROLE_ORDER) {
    legend.append(el('span', {}, el('span', { className: `badge role-${r}`, textContent: r }), ' ' + ROLES[r]));
  }
  wrap.append(legend);

  if (!p.people.length) {
    const add = el('button', { className: 'primary', textContent: 'Lisää henkilöitä' });
    add.onclick = openPeopleDialog;
    wrap.append(el('p', { className: 'hint', textContent: 'Projektissa ei ole vielä henkilöitä. ' }), add);
    return;
  }

  const table = el('table', { className: 'matrix' });
  const headRow = el('tr', {}, el('th', { textContent: 'Tehtävä', style: 'text-align:left' }));
  for (const person of p.people) headRow.append(el('th', { textContent: person.name }));
  headRow.append(el('th', { textContent: 'Valmius' }), el('th', { textContent: 'Huomiot' }));
  table.append(el('thead', {}, headRow));

  const tbody = el('tbody');
  for (const col of p.columns) {
    const group = el('tr', { className: 'group' });
    group.append(el('td', { colSpan: p.people.length + 3, textContent: `${col.title} (${visibleCount(p, col)})` }));
    tbody.append(group);

    for (const card of col.cards) {
      if (!cardVisible(p, card)) continue;
      const row = el('tr');
      const task = el('td', { className: 'task', title: 'Avaa kortti' });
      if (card.priority) task.append(prioBadge(card.priority));
      task.append(card.title);
      task.onclick = () => openCardDialog(null, card.id);
      row.append(task);

      for (const person of p.people) {
        const role = card.raci[person.id];
        const cell = el('td', { className: 'cell', title: 'Klikkaa vaihtaaksesi roolia (R → A → C → I → tyhjä)' });
        if (role) cell.append(el('span', { className: `badge role-${role}`, textContent: role }));
        cell.onclick = () => {
          const next = ROLE_ORDER[ROLE_ORDER.indexOf(role) + 1] ?? null; // undefined → R, I → tyhjä
          setRole(card.raci, person.id, role ? next : 'R');
          save(); render();
        };
        row.append(cell);
      }
      row.append(el('td', { className: 'pct', textContent: card.progress ? card.progress + ' %' : '–' }));
      row.append(el('td', { className: 'warn', textContent: raciWarnings(card).join(', ') }));
      tbody.append(row);
    }
  }
  table.append(tbody);
  wrap.append(table, el('p', { className: 'hint',
    textContent: 'Vinkki: jokaisella tehtävällä pitäisi olla tasan yksi A ja vähintään yksi R. Uusi A korvaa tehtävän edellisen A:n.' }));
}

// ---------- Henkilöt ----------
const peopleDialog = $('#peopleDialog');

function openPeopleDialog() {
  renderPeopleList();
  peopleDialog.showModal();
  $('#newPerson').focus();
}

function renderPeopleList() {
  const p = activeProject();
  const list = $('#peopleList');
  list.innerHTML = '';
  if (!p.people.length) list.append(el('p', { className: 'hint', textContent: 'Ei henkilöitä vielä.' }));
  for (const person of p.people) {
    const input = el('input', { value: person.name });
    input.onchange = () => {
      if (input.value.trim()) { person.name = input.value.trim(); save(); render(); }
      else input.value = person.name;
    };
    const del = el('button', { className: 'danger', textContent: 'Poista' });
    del.onclick = () => {
      if (!confirm(`Poistetaanko ${person.name}? Hänen RACI-roolinsa poistetaan kaikista korteista.`)) return;
      p.people = p.people.filter(x => x.id !== person.id);
      for (const col of p.columns) for (const card of col.cards) delete card.raci[person.id];
      save(); render(); renderPeopleList();
    };
    list.append(el('div', { className: 'person-row' }, input, del));
  }
}

$('#addPersonForm').onsubmit = e => {
  e.preventDefault();
  const name = $('#newPerson').value.trim();
  if (!name) return;
  activeProject().people.push({ id: uid(), name });
  $('#newPerson').value = '';
  save(); render(); renderPeopleList();
};

$('#closePeople').onclick = () => peopleDialog.close();

// ---------- Arkistokansio ----------
// Chrome/Edge: tiedostot kirjoitetaan käyttäjän valitsemaan kansioon (File System Access API).
// Muut selaimet: tiedosto ladataan selaimen latauskansioon.
const FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';
let archiveDir = null;        // kansion kahva
let archiveDirReady = false;  // onko kirjoitusoikeus myönnetty tällä istunnolla

// Kansion kahva säilytetään IndexedDB:ssä, jotta kansiota ei tarvitse valita joka kerta
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('simple-kanban', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}

async function initArchiveDir() {
  renderArchiveFolder();
  if (!FS_SUPPORTED) return;
  try {
    archiveDir = await idb('readonly', st => st.get('archiveDir')) ?? null;
    if (archiveDir) archiveDirReady = await archiveDir.queryPermission({ mode: 'readwrite' }) === 'granted';
  } catch { archiveDir = null; }
  renderArchiveFolder();
}

async function chooseArchiveDir() {
  archiveDir = await showDirectoryPicker({ id: 'kanban-arkisto', mode: 'readwrite' });
  archiveDirReady = true;
  renderArchiveFolder();
  idb('readwrite', st => st.put(archiveDir, 'archiveDir')).catch(() => {}); // muistaminen ei saa estää tallennusta
}

// Palauttaa kirjoitettavan kansion; kysyy luvan tai kansion tarvittaessa (vaatii käyttäjän klikkauksen)
async function ensureArchiveDir() {
  if (archiveDir && !archiveDirReady) {
    archiveDirReady = await archiveDir.requestPermission({ mode: 'readwrite' }) === 'granted';
  }
  if (!archiveDirReady) await chooseArchiveDir();
  renderArchiveFolder();
  return archiveDir;
}

function renderArchiveFolder() {
  const box = $('#archiveFolder');
  box.innerHTML = '';
  if (!FS_SUPPORTED) {
    box.append(el('span', { textContent: 'Arkistotiedostot ladataan selaimen latauskansioon.' }));
    return;
  }
  const pick = el('button', { textContent: archiveDir ? 'Vaihda' : '📁 Valitse arkistokansio' });
  pick.onclick = () => chooseArchiveDir().catch(() => {});
  if (archiveDir) {
    box.append('Kansio:', el('span', { className: 'folder-name', textContent: archiveDir.name }));
    if (!archiveDirReady) {
      const connect = el('button', { textContent: 'Salli käyttö', title: 'Selain vaatii luvan kansioon kirjoittamiseen' });
      connect.onclick = () => ensureArchiveDir().catch(() => {});
      box.append(connect);
    }
  }
  box.append(pick);
}

const slug = name => name.toLowerCase().replace(/[^a-z0-9åäö]+/g, '-').replace(/^-|-$/g, '') || 'projekti';
const archiveData = p => ({ type: 'simple-kanban-project', version: 1, project: p });
const archiveFileName = p => `arkisto-${slug(p.name)}-${p.archivedAt.slice(0, 10)}.json`;

async function fileExists(dir, name) {
  try { await dir.getFileHandle(name); return true; } catch { return false; }
}

// Tallentaa arkistoidun projektin omaksi tiedostokseen. Palauttaa tiedoston nimen.
async function writeArchiveFile(p) {
  if (!FS_SUPPORTED) {
    downloadJson(archiveData(p), archiveFileName(p));
    return { name: archiveFileName(p), where: 'Lataukset' };
  }
  const dir = await ensureArchiveDir();
  let name = archiveFileName(p);
  for (let i = 2; await fileExists(dir, name); i++) name = archiveFileName(p).replace(/\.json$/, `-${i}.json`);
  const writable = await (await dir.getFileHandle(name, { create: true })).createWritable();
  await writable.write(JSON.stringify(archiveData(p), null, 2));
  await writable.close();
  return { name, where: dir.name };
}

// ---------- Arkisto ----------
async function archiveProject(p) {
  if (!confirm(`Arkistoidaanko projekti "${p.name}"?\n\nSe tallennetaan omaksi JSON-tiedostokseen ja siirretään arkistoon, josta sen voi palauttaa.`)) return;
  const archived = { ...p, archivedAt: new Date().toISOString() };
  try {
    const file = await writeArchiveFile(archived);
    archived.archiveFile = `${file.where}/${file.name}`;
  } catch (err) {
    if (!confirm(`Tiedostoon tallennus epäonnistui (${err.message}).\n\nArkistoidaanko silti pelkästään sovelluksen sisälle?`)) return;
  }
  state.projects = state.projects.filter(x => x.id !== p.id);
  state.archive.push(archived);
  state.activeId = state.projects[0]?.id ?? null;
  $('#archiveSection').open = true;
  save(); render();
}

async function saveArchiveFile(p) {
  try {
    const file = await writeArchiveFile(p);
    p.archiveFile = `${file.where}/${file.name}`;
    save(); render();
  } catch (err) {
    if (err.name !== 'AbortError') alert('Tallennus epäonnistui: ' + err.message);
  }
}

function restoreProject(p) {
  state.archive = state.archive.filter(x => x.id !== p.id);
  const { archivedAt, archiveFile, ...project } = p;
  state.projects.push(project);
  state.activeId = project.id;
  state.archiveViewId = null;
  save(); render();
}

function downloadJson(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: filename });
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderArchiveView(p) {
  const header = $('#header');
  header.innerHTML = '';
  const restore = el('button', { className: 'primary', textContent: '↩ Palauta' });
  restore.onclick = () => restoreProject(p);
  const download = el('button', {
    textContent: FS_SUPPORTED ? '💾 Tallenna tiedostoksi' : '⬇ Lataa JSON',
    title: FS_SUPPORTED ? 'Tallenna projekti arkistokansioon omaksi tiedostokseen' : 'Lataa projekti JSON-tiedostona',
  });
  download.onclick = () => saveArchiveFile(p);
  const del = el('button', { className: 'danger', textContent: 'Poista pysyvästi' });
  del.onclick = () => {
    const fileNote = p.archiveFile ? `\n\nArkistotiedosto ${p.archiveFile} säilyy levyllä.` : '';
    if (!confirm(`Poistetaanko arkistoitu projekti "${p.name}" sovelluksesta pysyvästi?${fileNote}`)) return;
    state.archive = state.archive.filter(x => x.id !== p.id);
    state.archiveViewId = null;
    save(); render();
  };
  header.append(el('h2', { textContent: p.name, style: 'cursor:default' }), restore, download, del);

  $('#banner').append(el('div', { className: 'archived-banner',
    textContent: `📦 Arkistoitu ${fmtDate(p.archivedAt)} – vain luku. Palauta projekti muokataksesi sitä. ` +
      (p.archiveFile ? `Tiedosto: ${p.archiveFile}` : 'Ei vielä tallennettu tiedostoksi.') }));

  const board = $('#board');
  board.innerHTML = '';
  for (const col of p.columns) {
    const cards = el('div', { className: 'cards' });
    for (const card of col.cards) cards.append(renderCard(card, p, true));
    const head = el('div', { className: 'column-head' },
      el('h3', { textContent: col.title, style: 'cursor:default' }),
      el('span', { className: 'count', textContent: col.cards.length }));
    board.append(el('div', { className: 'column readonly' }, head, cards));
  }
}

// ---------- Raahaus ----------
function setupDropZone(zone) {
  zone.ondragover = e => {
    e.preventDefault();
    zone.classList.add('drag-over');
  };
  zone.ondragleave = e => {
    if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
  };
  zone.ondrop = e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const cardId = e.dataTransfer.getData('text/plain');
    const p = activeProject();
    const from = findCard(p, cardId);
    if (!from) return;

    // Pudotuskohta näkyvien korttien perusteella; suodatuksen piilottamat kortit pysyvät paikallaan
    const others = [...zone.querySelectorAll('.card')].filter(c => c.dataset.cardId !== cardId);
    const before = others.find(c => {
      const r = c.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
    const after = before ? null : others.at(-1);

    const [card] = from.col.cards.splice(from.index, 1);
    const target = p.columns.find(c => c.id === zone.dataset.colId).cards;
    let index = target.length;
    if (before) index = target.findIndex(c => c.id === before.dataset.cardId);
    else if (after) index = target.findIndex(c => c.id === after.dataset.cardId) + 1;
    target.splice(index, 0, card);
    sortByDeps(p);
    save(); render();
  };
}

function findCard(project, cardId) {
  for (const col of project.columns) {
    const index = col.cards.findIndex(c => c.id === cardId);
    if (index !== -1) return { col, index, card: col.cards[index] };
  }
  return null;
}

// ---------- Korttidialogi ----------
const dialog = $('#cardDialog');
let editing = null; // { colId, cardId }
let selectedColor = 'transparent';
let draftRaci = {};
let draftPriority = '';
let draftDeps = [];

function renderDepsPicker() {
  const p = activeProject();
  const selfId = editing.cardId;
  const wrap = $('#cardDeps');
  wrap.innerHTML = '';
  const list = el('div', { className: 'deps-list' });
  for (const id of draftDeps) {
    const f = findCard(p, id);
    if (!f) continue;
    const x = el('button', { type: 'button', textContent: '✕', title: 'Poista riippuvuus' });
    x.onclick = () => { draftDeps = draftDeps.filter(d => d !== id); renderDepsPicker(); };
    list.append(el('span', { className: 'dep-chip' + (isDoneCol(p, f.col) ? ' done' : ''), title: `Sarake: ${f.col.title}` }, f.card.title, x));
  }
  if (list.children.length) wrap.append(list);
  const sel = el('select', { className: 'dep-add' });
  sel.append(el('option', { value: '', textContent: '+ Lisää edeltävä tehtävä…' }));
  for (const col of p.columns) {
    const group = el('optgroup', { label: col.title });
    for (const c of col.cards) {
      if (c.id === selfId || draftDeps.includes(c.id)) continue;
      if (selfId && dependsOn(p, c.id, selfId)) continue; // estää kehän
      group.append(el('option', { value: c.id, textContent: c.title }));
    }
    if (group.children.length) sel.append(group);
  }
  sel.onchange = () => { if (sel.value) { draftDeps.push(sel.value); renderDepsPicker(); } };
  wrap.append(sel);
}

function renderPriorityPicker() {
  const wrap = $('#cardPriority');
  wrap.innerHTML = '';
  for (const prio of ['', ...Object.keys(PRIORITIES)]) {
    const on = draftPriority === prio;
    const b = el('button', {
      type: 'button', textContent: prio || '–', title: prio ? PRIORITIES[prio] : 'Ei tärkeyttä',
      className: on ? (prio ? `on prio-${prio}` : 'on none') : '',
    });
    b.onclick = () => { draftPriority = prio; renderPriorityPicker(); };
    wrap.append(b);
  }
}

function renderRaciPicker() {
  const wrap = $('#cardRaci');
  wrap.innerHTML = '';
  const people = activeProject().people;
  if (!people.length) {
    wrap.append(el('p', { className: 'hint', textContent: 'Lisää projektiin henkilöitä (👥 Henkilöt), niin voit antaa heille rooleja.' }));
    return;
  }
  for (const person of people) {
    const pick = el('div', { className: 'raci-pick' });
    for (const r of ROLE_ORDER) {
      const on = draftRaci[person.id] === r;
      const b = el('button', { type: 'button', textContent: r, title: ROLES[r], className: on ? `on role-${r}` : '' });
      b.onclick = () => { setRole(draftRaci, person.id, on ? null : r); renderRaciPicker(); };
      pick.append(b);
    }
    wrap.append(el('div', { className: 'raci-row' }, el('span', { className: 'name', textContent: person.name }), pick));
  }
  const warnings = raciWarnings({ raci: draftRaci });
  if (warnings.length) wrap.append(el('p', { className: 'hint', textContent: '⚠ ' + warnings.join(', ') }));
}

function renderColorPicker() {
  const wrap = $('#cardColors');
  wrap.innerHTML = '';
  for (const c of COLORS) {
    const s = el('span', { className: c === selectedColor ? 'selected' : '', title: c === 'transparent' ? 'Ei väriä' : c });
    s.style.background = c === 'transparent' ? 'repeating-linear-gradient(45deg,var(--line) 0 3px,var(--input) 3px 6px)' : c;
    s.onclick = () => { selectedColor = c; renderColorPicker(); };
    wrap.append(s);
  }
}

function openCardDialog(colId, cardId, presetDue = '') {
  editing = { colId, cardId };
  const found = cardId ? findCard(activeProject(), cardId) : null;
  $('#cardDialogTitle').textContent = found ? 'Muokkaa korttia' : 'Uusi kortti';
  $('#cardTitle').value = found?.card.title ?? '';
  $('#cardDesc').value = found?.card.desc ?? '';
  $('#cardDue').value = found?.card.due ?? presetDue;
  setProgressInput(found?.card.progress ?? 0);
  $('#cardDuration').value = found?.card.duration ?? 1;
  $('#cardGantt').checked = found?.card.gantt !== false;
  draftDeps = [...(found ? depsOf(found.card) : [])];
  renderDepsPicker();
  selectedColor = found?.card.color ?? 'transparent';
  $('#deleteCard').hidden = !found;
  draftRaci = { ...(found?.card.raci ?? {}) };
  draftPriority = found?.card.priority ?? '';
  renderPriorityPicker();
  renderColorPicker();
  renderRaciPicker();
  dialog.showModal();
  $('#cardTitle').focus();
}

$('#cardForm').onsubmit = () => {
  const title = $('#cardTitle').value.trim();
  if (!title) return;
  const desc = $('#cardDesc').value.trim();
  const due = $('#cardDue').value || undefined;
  const progress = Number($('#cardProgress').value) || undefined;
  const priority = draftPriority || undefined;
  const duration = Math.max(1, Math.round(Number($('#cardDuration').value) || 1));
  const p = activeProject();
  let card;
  if (editing.cardId) {
    card = findCard(p, editing.cardId).card;
    Object.assign(card, { title, desc, color: selectedColor, raci: draftRaci });
  } else {
    card = { id: uid(), title, desc, color: selectedColor, raci: draftRaci };
    p.columns.find(c => c.id === editing.colId).cards.push(card);
  }
  // Valinnaiset kentät tallennetaan vain, jos ne on asetettu
  const opt = (k, v) => v === undefined ? delete card[k] : card[k] = v;
  opt('due', due);
  opt('progress', progress);
  opt('priority', priority);
  opt('duration', duration > 1 ? duration : undefined);
  opt('deps', draftDeps.length ? [...draftDeps] : undefined);
  opt('gantt', $('#cardGantt').checked ? undefined : false);
  sortByDeps(p);
  save(); render();
};

$('#cancelCard').onclick = () => dialog.close();
$('#clearDue').onclick = () => { $('#cardDue').value = ''; };

function setProgressInput(v) {
  $('#cardProgress').value = v;
  $('#progressVal').textContent = v + ' %';
}
$('#cardProgress').oninput = () => setProgressInput($('#cardProgress').value);
for (const v of [0, 25, 50, 75, 100]) {
  const b = el('button', { type: 'button', textContent: v + ' %' });
  b.onclick = () => setProgressInput(v);
  $('#progressQuick').append(b);
}

$('#deleteCard').onclick = () => {
  const found = findCard(activeProject(), editing.cardId);
  if (found && confirm(`Poistetaanko kortti "${found.card.title}"?`)) {
    const p = activeProject();
    found.col.cards.splice(found.index, 1);
    for (const col of p.columns) for (const c of col.cards) if (depsOf(c).includes(found.card.id)) removeDependency(p, found.card.id, c);
    save(); render(); dialog.close();
  }
};

// ---------- Projektit, vienti ja tuonti ----------
$('#addProject').onclick = () => {
  const name = prompt('Uuden projektin nimi:');
  if (!name?.trim()) return;
  const p = newProject(name.trim());
  state.projects.push(p);
  state.activeId = p.id;
  state.archiveViewId = null;
  save(); render();
};

const projectData = p => ({ type: 'simple-kanban-project', version: 1, project: p });

// Jokainen projekti (aktiivinen ja arkistoitu) omaksi tiedostokseen
async function exportAllSeparate() {
  const files = [];
  const used = new Set();
  const unique = name => {
    let n = name;
    for (let i = 2; used.has(n); i++) n = name.replace(/\.json$/, `-${i}.json`);
    used.add(n);
    return n;
  };
  for (const p of state.projects) files.push({ name: unique(`projekti-${slug(p.name)}.json`), data: projectData(p) });
  for (const p of state.archive) {
    const { archiveFile, ...clean } = p;
    files.push({ name: unique(archiveFileName(p)), data: projectData(clean) });
  }
  if (!files.length) { alert('Ei vietäviä projekteja.'); return; }

  if (FS_SUPPORTED) {
    let parent;
    try { parent = await showDirectoryPicker({ id: 'kanban-vienti', mode: 'readwrite' }); }
    catch { return; } // käyttäjä perui
    const stamp = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '');
    const dir = await parent.getDirectoryHandle(`raciban-vienti-${stamp}`, { create: true });
    for (const f of files) {
      const w = await (await dir.getFileHandle(f.name, { create: true })).createWritable();
      await w.write(JSON.stringify(f.data, null, 2));
      await w.close();
    }
    markBackedUp();
    alert(`Tallennettiin ${files.length} tiedostoa kansioon ${parent.name}/${dir.name}\n` +
      `(${state.projects.length} projektia, ${state.archive.length} arkistoitua)`);
  } else {
    if (!confirm(`Ladataan ${files.length} tiedostoa (${state.projects.length} projektia, ${state.archive.length} arkistoitua). ` +
      'Selain voi kysyä luvan useiden tiedostojen lataamiseen. Jatketaanko?')) return;
    for (const f of files) {
      downloadJson(f.data, f.name);
      await new Promise(r => setTimeout(r, 300)); // selaimet estävät liian nopeat peräkkäiset lataukset
    }
    markBackedUp();
  }
}

$('#exportAllSeparate').onclick = () => exportAllSeparate().catch(err => alert('Vienti epäonnistui: ' + err.message));

$('#exportBtn').onclick = () => {
  downloadJson(state, `raciban-${new Date().toISOString().slice(0, 10)}.json`);
  markBackedUp();
};

$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;

  const parsed = [];
  const errors = [];
  for (const file of files) {
    try { parsed.push({ file, data: JSON.parse(await file.text()) }); }
    catch { errors.push(`${file.name}: ei kelvollista JSONia`); }
  }

  // Koko varmuuskopio korvaa kaiken – sallitaan vain yksinään
  const backups = parsed.filter(x => Array.isArray(x.data.projects));
  if (backups.length) {
    if (parsed.length > 1) { alert('Varmuuskopiotiedosto (koko data) täytyy tuoda yksinään.'); return; }
    const data = backups[0].data;
    if (!confirm('Tuonti korvaa kaikki nykyiset projektit ja arkiston. Jatketaanko?')) return;
    state = normalize({ projects: data.projects, archive: data.archive, activeId: data.activeId ?? data.projects[0]?.id ?? null, view: 'board' });
    save(); render();
    return;
  }

  // Projektitiedostot: arkistoitu (archivedAt) → arkistoon, muuten aktiivisiin projekteihin
  let active = 0, archived = 0, skipped = 0;
  for (const { file, data } of parsed) {
    if (data.type !== 'simple-kanban-project' || !data.project?.columns) {
      errors.push(`${file.name}: ei Raciban-projektitiedosto`);
      continue;
    }
    const p = normalize({ projects: [data.project] }).projects[0];
    delete p.archiveFile;
    if (state.projects.some(x => x.id === p.id) || state.archive.some(x => x.id === p.id)) { skipped++; continue; }
    if (p.archivedAt) { state.archive.push(p); archived++; }
    else { state.projects.push(p); active++; state.activeId = p.id; state.archiveViewId = null; }
  }
  if (archived) $('#archiveSection').open = true;
  save(); render();

  const lines = [`Tuotiin ${active} projektia ja ${archived} arkistoitua.`];
  if (skipped) lines.push(`Ohitettiin ${skipped}, jotka ovat jo sovelluksessa.`);
  if (errors.length) lines.push('', 'Virheet:', ...errors);
  alert(lines.join('\n'));
};

// ---------- Teema ----------
function updateThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeToggle').textContent = dark ? '☀️' : '🌙';
  $('#themeToggle').title = dark ? 'Vaihda vaaleaan teemaan' : 'Vaihda tummaan teemaan';
}
$('#themeToggle').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('simple-kanban-theme', next);
  updateThemeButton();
};
// Seurataan järjestelmän teemaa, kunnes käyttäjä valitsee itse
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (localStorage.getItem('simple-kanban-theme')) return;
  document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
  updateThemeButton();
});
updateThemeButton();

// ---------- Varmuuskopiomuistutus ----------
// Muistutetaan, kun vanhin varmuuskopioimaton muutos on yli BACKUP_REMIND_DAYS päivää vanha.
const BACKUP_KEY = 'simple-kanban-backup';
const BACKUP_REMIND_DAYS = 7;
const DAY = 864e5;

function backupInfo() {
  try { return JSON.parse(localStorage.getItem(BACKUP_KEY)) ?? {}; } catch { return {}; }
}
function setBackupInfo(info) {
  localStorage.setItem(BACKUP_KEY, JSON.stringify(info));
  renderBackupReminder();
}
const hasData = () => state.projects.length > 0 || state.archive.length > 0;

function markChanged() {
  const info = backupInfo();
  if (!info.dirtySince) setBackupInfo({ ...info, dirtySince: new Date().toISOString() });
}

function markBackedUp() {
  setBackupInfo({ last: new Date().toISOString(), dirtySince: null, snoozeUntil: null });
}

const daysAgo = iso => Math.floor((Date.now() - new Date(iso)) / DAY);
const relDays = n => n <= 0 ? 'tänään' : n === 1 ? 'eilen' : `${n} päivää sitten`;

function renderBackupReminder() {
  const info = backupInfo();
  const box = $('#backupReminder');
  const status = $('#backupStatus');

  const dirtyDays = info.dirtySince ? daysAgo(info.dirtySince) : 0;
  const snoozed = info.snoozeUntil && new Date(info.snoozeUntil) > new Date();
  const remind = hasData() && info.dirtySince && dirtyDays >= BACKUP_REMIND_DAYS && !snoozed;

  status.textContent = !hasData() ? ''
    : info.last ? `Viimeisin varmuuskopio: ${relDays(daysAgo(info.last))}` + (info.dirtySince ? ' (muutoksia sen jälkeen)' : '')
    : 'Varmuuskopiota ei ole vielä otettu';
  status.classList.toggle('warn', !!remind);

  box.hidden = !remind;
  if (!remind) return;
  box.innerHTML = '';
  const backup = el('button', { className: 'primary', textContent: '💾 Ota varmuuskopio' });
  backup.onclick = () => $('#exportBtn').click();
  const later = el('button', { textContent: 'Muistuta huomenna' });
  later.onclick = () => setBackupInfo({ ...info, snoozeUntil: new Date(Date.now() + DAY).toISOString() });
  box.append(
    el('strong', { textContent: '⚠ Muista varmuuskopio' }),
    info.last
      ? `Edellinen varmuuskopio on otettu ${relDays(daysAgo(info.last))}, ja sen jälkeen on tehty muutoksia. `
      : 'Et ole vielä ottanut varmuuskopiota. ',
    'Tiedot ovat vain tämän selaimen muistissa ja katoavat, jos selaimen tiedot tyhjennetään.',
    el('div', { className: 'actions' }, backup, later));
}

// Olemassa olevalle datalle, jota ei ole koskaan varmuuskopioitu, muistutetaan heti
if (!localStorage.getItem(BACKUP_KEY) && hasData()) {
  localStorage.setItem(BACKUP_KEY, JSON.stringify({ dirtySince: new Date(0).toISOString() }));
}
setInterval(renderBackupReminder, 60 * 60 * 1000); // tarkistetaan tunnin välein, jos sivu on pitkään auki
renderBackupReminder();

render();
initArchiveDir();
</script>
